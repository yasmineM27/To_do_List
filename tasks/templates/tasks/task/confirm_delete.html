{% extends 'base.html' %}

{% block title %}Delete {{ task.title }} - TaskFlow{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="bg-white shadow rounded-lg">
        <div class="px-6 py-5 border-b border-gray-200">
            <h1 class="text-lg font-medium text-gray-900">Delete Task</h1>
        </div>
        <div class="px-6 py-5">
            <div class="bg-red-50 border-l-4 border-red-400 p-4 mb-6">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fas fa-exclamation-triangle text-red-400"></i>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-red-700">
                            Are you sure you want to delete the task "{{ task.title }}"? This action cannot be undone.
                        </p>
                    </div>
                </div>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="mt-6 flex items-center justify-end">
                    <a href="{% url 'tasks:task_detail' pk=task.pk %}" class="mr-4 text-sm font-medium text-gray-700 hover:text-gray-500">
                        Cancel
                    </a>
                    <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                        Delete Permanently
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
